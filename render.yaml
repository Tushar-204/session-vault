services:
  - type: web
    name: sessionvault
    runtime: node
    rootDir: server
    plan: free

    buildCommand: npm install && cd ../client && npm install && npm run build && cd ../server && rm -rf public && cp -r ../client/dist public

    startCommand: npm start

    envVars:
      - key: NODE_ENV
        value: production

      - key: MONGODB_URI
        sync: false

      - key: CLIENT_URL
        sync: false

      - key: JWT_ACCESS_SECRET
        sync: false

      - key: JWT_REFRESH_SECRET
        sync: false

      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m

      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d